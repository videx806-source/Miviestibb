<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VIDEX APP</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- hls.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.10/hls.min.js"></script>

  <style>
    body {
      background-color: #0a0a0f;
      color: #ffffff;
      font-family: 'Barlow', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-title {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.05em;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a0f;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f1f2e;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f5c518;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.08); }
    }
    .live-pulse {
      animation: pulse 1.2s infinite ease-in-out;
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBg: '#0a0a0f',
            brandSurface: '#12121a',
            brandGold: '#f5c518',
            brandPurple: '#7c3aed',
          }
        }
      }
    };
  </script>
</head>
<body class="bg-[#0a0a0f]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // A clean Custom Toast notification system
    function Toast({ message, onClose }) {
      useEffect(() => {
        const timer = setTimeout(onClose, 3000);
        return () => clearTimeout(timer);
      }, [onClose]);

      return (
        <div class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-brandPurple/95 border border-white/10 text-white font-semibold py-3 px-6 rounded-full shadow-2xl backdrop-blur-md text-sm z-50 flex items-center space-x-2 animate-bounce">
          <span>{message}</span>
        </div>
      );
    }

    // Component: TV Channel custom branding placeholder
    function PlaceholderCanal({ nombre }) {
      return (
        <div class="w-full h-full flex flex-col items-center justify-center bg-[#1e1e2e] rounded-xl p-2 text-center">
          <svg class="w-10 h-10 text-brandGold mb-2" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h14.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125z" />
          </svg>
          <span class="text-xs font-bold text-white uppercase tracking-wider truncate w-full px-1">{nombre}</span>
        </div>
      );
    }

    // Channel Thumbnail with robust image loading onError recovery
    function ChannelIcon({ canal, onClick }) {
      const [imgError, setImgError] = useState(false);
      const isPremium = canal.es_premium === true;
      const isActive = canal.activo !== false;
      const logoSrc = !imgError && (canal.img || canal.logo_url);

      return (
        <div 
          onClick={onClick}
          class={`relative bg-brandSurface/80 hover:bg-[#181824] rounded-xl p-3 flex flex-col items-center justify-between min-h-[142px] border cursor-pointer hover:border-brandPurple hover:scale-[1.04] transition-all duration-200 ${
            isActive ? 'border-white/5' : 'opacity-40 grayscale border-red-500/10'
          }`}
        >
          {/* Top badges */}
          <div class="absolute top-1.5 left-1.5 flex flex-col space-y-1">
            {canal.resolucion && (
              <span class="bg-[#1e1e2e] text-white/90 border border-white/10 font-bold text-[8px] tracking-widest px-1.5 py-0.5 rounded">
                {canal.resolucion}
              </span>
            )}
          </div>

          {isPremium && (
            <div class="absolute top-1.5 right-1.5 bg-brandGold text-[#000000] font-bold text-[8px] px-1.5 py-0.5 rounded shadow-md tracking-wider">
              PREMIUM
            </div>
          )}

          {/* Icon/Logo container */}
          <div class="w-16 h-16 flex items-center justify-center rounded-2xl bg-[#0e0e15] overflow-hidden my-auto p-1.5">
            {logoSrc ? (
              <img 
                src={logoSrc} 
                alt={canal.nombre} 
                class="max-w-full max-h-full object-contain" 
                onError={() => setImgError(true)} 
              />
            ) : (
              <PlaceholderCanal nombre={canal.nombre} />
            )}
          </div>

          <span class="text-xs font-semibold text-white/95 truncate text-center w-full uppercase tracking-wider mt-2 group-hover:text-brandGold transition">
            {canal.nombre}
          </span>

          {/* Locked feedback Overlay */}
          {!isActive && (
            <div class="absolute inset-0 bg-brandBg/80 backdrop-blur-[1px] rounded-xl flex items-center justify-center">
              <div class="bg-red-500/15 border border-red-500/30 p-2.5 rounded-full text-red-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Main App
    function App() {
      const [activeTab, setActiveTab] = useState('en_vivo');
      const [originTab, setOriginTab] = useState('en_vivo');
      const [currentStream, setCurrentStream] = useState(null); // { id, title, stream_url, img, category, description, type, isSavedReg }
      const [toastMsg, setToastMsg] = useState('');

      // New Config Management
      const defaultSettings = {
        modoOscuroPuro: false,
        animacionesReducidas: false,
        autoplayAlSeleccionar: true,
        reconexionAutomatica: true,
        calidadPreferida: 'Auto'
      };

      const [config, setConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('videx_config');
          if (saved) {
            return { ...defaultSettings, ...JSON.parse(saved) };
          }
        } catch (e) {
          console.error("Error reading videx_config", e);
        }
        return defaultSettings;
      });

      const [configModalOpen, setConfigModalOpen] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem('videx_config', JSON.stringify(config));
        } catch (e) {
          console.error("Error saving videx_config", e);
        }
      }, [config]);

      // Apply Modo Oscuro Puro background-color directly to native document elements
      useEffect(() => {
        document.body.style.backgroundColor = config.modoOscuroPuro ? '#000000' : '#0a0a0f';
      }, [config.modoOscuroPuro]);

      // Apply Reduced motion override
      useEffect(() => {
        const styleId = 'reduced-motion-style';
        let styleEl = document.getElementById(styleId);
        if (config.animacionesReducidas) {
          if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = styleId;
            styleEl.innerHTML = `
              * {
                animation-delay: 0s !important;
                animation-duration: 0s !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0s !important;
                transition-delay: 0s !important;
                scroll-behavior: auto !important;
              }
            `;
            document.head.appendChild(styleEl);
          }
        } else {
          if (styleEl) {
            styleEl.remove();
          }
        }
      }, [config.animacionesReducidas]);

      // Events
      const [eventos, setEventos] = useState([]);
      const [eventsStatus, setEventsStatus] = useState('loading');

      // Channels
      const [canales, setCanales] = useState([]);
      const [channelsStatus, setChannelsStatus] = useState('loading');
      const [channelSearch, setChannelSearch] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todos');

      // Movies
      const [movieSearch, setMovieSearch] = useState('');
      const [directUrl, setDirectUrl] = useState('');
      const [movieResults, setMovieResults] = useState([]);
      const [moviesSearchStatus, setMoviesSearchStatus] = useState('idle');
      const [selectedMovie, setSelectedMovie] = useState(null);
      const [movieDetailsStatus, setMovieDetailsStatus] = useState('idle');

      // Recordings Historial from LocalStorage (videx_grabaciones)
      const [recordings, setRecordings] = useState([]);

      const triggerToast = (msg) => {
        if (window.AndroidInterface && window.AndroidInterface.showToast) {
          window.AndroidInterface.showToast(msg);
        } else {
          setToastMsg(msg);
        }
      };

      const loadRecordings = () => {
        try {
          let stored = localStorage.getItem('videx_grabaciones');
          if (!stored) {
            // Check legacy
            stored = localStorage.getItem('videx_recordings');
            if (stored) {
              const parsed = JSON.parse(stored);
              const migrated = parsed.map(item => ({
                id: item.id || Date.now().toString(),
                titulo: item.titulo,
                fecha: item.fecha,
                duracion: item.duracion,
                archivo: item.archivo || item.nombreArchivo || `videx_rec_${item.id}.webm`
              }));
              localStorage.setItem('videx_grabaciones', JSON.stringify(migrated));
              localStorage.removeItem('videx_recordings');
              stored = JSON.stringify(migrated);
            }
          }
          if (stored) {
            setRecordings(JSON.parse(stored));
          } else {
            setRecordings([]);
          }
        } catch (e) {
          console.error("Error reading localStorage", e);
        }
      };

      useEffect(() => {
        loadRecordings();
      }, []);

      // Navigation handler supporting browser state & android physical back button
      const navigateTo = (tab, push = true) => {
        setActiveTab(tab);
        if (tab !== 'reproductor') {
          setOriginTab(tab);
        }
        if (push) {
          window.history.pushState({ view: tab }, '', '');
        }
      };

      // Set up back button tracking
      useEffect(() => {
        // Prepare initial replaceState
        window.history.replaceState({ view: 'en_vivo' }, '', '');

        const handlePop = (e) => {
          const state = e.state;
          if (state && state.view) {
            if (state.view === 'reproductor') {
              setActiveTab('reproductor');
            } else {
              if (activeTab === 'reproductor') {
                setCurrentStream(null); // Close player
              }
              setActiveTab(state.view);
            }
          }
        };

        window.addEventListener('popstate', handlePop);
        return () => window.removeEventListener('popstate', handlePop);
      }, [activeTab]);

      // FETCH EVENTS
      const fetchEvents = async () => {
        setEventsStatus('loading');
        try {
          const res = await fetch('https://apio.videx.lol/eventosss.json');
          if (!res.ok) throw new Error();
          const data = await res.json();
          setEventos(data.eventos || []);
          setEventsStatus('success');
        } catch (e) {
          setEventsStatus('error');
        }
      };

      // FETCH CANALES
      const fetchChannels = async () => {
        setChannelsStatus('loading');
        try {
          const res = await fetch('https://apio.videx.lol/canales.json');
          if (!res.ok) throw new Error();
          const data = await res.json();
          const parsed = data.canales ? data.canales.map(item => item.canal).filter(Boolean) : [];
          setCanales(parsed);
          setChannelsStatus('success');
        } catch (e) {
          setChannelsStatus('error');
        }
      };

      useEffect(() => {
        fetchEvents();
        fetchChannels();
      }, []);

      const categories = useMemo(() => {
        const list = ['Todos'];
        canales.forEach(item => {
          if (item.categoria && !list.includes(item.categoria)) {
            list.push(item.categoria);
          }
        });
        return list;
      }, [canales]);

      // Movies Debounce search
      useEffect(() => {
        if (!movieSearch.trim()) {
          setMovieResults([]);
          setMoviesSearchStatus('idle');
          return;
        }
        setMoviesSearchStatus('loading');
        const delay = setTimeout(async () => {
          try {
            const res = await fetch(`https://apio.videx.lol/movies/sk.php?q=${encodeURIComponent(movieSearch)}`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            setMovieResults(data.results || []);
            setMoviesSearchStatus('success');
          } catch (e) {
            setMoviesSearchStatus('error');
          }
        }, 500);

        return () => clearTimeout(delay);
      }, [movieSearch]);

      // Request movie detail parser v3.php
      const handleSelectMovieResult = async (url) => {
        setMovieDetailsStatus('loading');
        setSelectedMovie(null);
        try {
          const res = await fetch(`https://apio.videx.lol/movies/v3.php?url=${encodeURIComponent(url)}`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          setSelectedMovie(data);
          setMovieDetailsStatus('success');
        } catch (e) {
          setMovieDetailsStatus('error');
          triggerToast('Error al conectar con los servidores de video.');
        }
      };

      // Direct URL Parser
      const handleDirectUrlOpen = () => {
        if (!directUrl.trim()) return;
        if (!directUrl.includes('h5.swplayer.com')) {
          triggerToast('URL no válida. Debe ser de h5.swplayer.com');
          return;
        }
        handleSelectMovieResult(directUrl.trim());
      };

      // Select and play dynamic HLS/VOD signal
      const playContent = (stream) => {
        setCurrentStream(stream);
        setActiveTab('reproductor');
        window.history.pushState({ view: 'reproductor' }, '', '');
      };

      return (
        <div class={`flex flex-col min-h-screen ${config.modoOscuroPuro ? 'bg-black' : 'bg-[#0a0a0f]'} text-white`}>
          
          {/* Header Branding */}
          <header class="bg-[#12121a]/95 border-b border-white/5 py-3.5 px-5 flex justify-between items-center sticky top-0 z-30 backdrop-blur-md">
            <div class="flex items-center space-x-2">
              <span class="w-2.5 h-6 bg-brandGold rounded-full shadow-lg shadow-brandGold/30"></span>
              <h1 class="text-2xl font-black font-title tracking-widest text-white">
                VIDEX<span class="text-brandGold">APP</span>
              </h1>
            </div>

            <div class="flex items-center space-x-3">
              {currentStream && activeTab !== 'reproductor' && (
                <button 
                  onClick={() => navigateTo('reproductor')}
                  class="flex items-center space-x-1.5 bg-brandPurple hover:bg-brandPurple/80 transition text-[11px] font-bold px-3 py-1.5 rounded-full text-white shadow-xl live-pulse border border-brandPurple/30"
                >
                  <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                  </svg>
                  <span>SINTONIZANDO</span>
                </button>
              )}

              {/* Gear settings button */}
              <button 
                onClick={() => setConfigModalOpen(true)}
                class="text-white/60 hover:text-white p-2 rounded-full hover:bg-white/5 transition flex items-center justify-center"
                title="Configuración"
              >
                <svg class="w-5 h-5 transition-transform hover:rotate-45 duration-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127c.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.43l-1.003.828c-.293.242-.438.613-.43.992a7.723 7.723 0 010 .252c-.008.379.137.75.43.992l1.003.828a1.125 1.125 0 01.26 1.43l-1.296 2.247a1.125 1.125 0 01-1.37.49l-1.216-.456c-.356-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.43l1.003-.827c.293-.242.438-.614.43-.992a7.711 7.711 0 010-.252c.008-.379-.137-.75-.43-.992l-1.003-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.49l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128c.332-.183.582-.495.644-.869l.214-1.28z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              </button>
            </div>
          </header>

          <main class="flex-grow pb-28">

            {/* TAB #1 🔴 EN VIVO */}
            {activeTab === 'en_vivo' && (
              <div class="px-4 py-5 animate-fade-in">
                <div class="flex items-center justify-between mb-5">
                  <div class="flex items-center space-x-2">
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-600"></span>
                    </span>
                    <h2 class="text-lg font-bold font-title tracking-widest text-red-500 uppercase">TRANSMISIONES EN VIVO</h2>
                  </div>
                  <button onClick={fetchEvents} class="text-white/40 hover:text-white p-1.5 rounded-full bg-white/5 hover:bg-white/10 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                    </svg>
                  </button>
                </div>

                {eventsStatus === 'loading' && (
                  <div class="grid grid-cols-2 lg:grid-cols-3 gap-4">
                    {[1, 2, 3, 4].map(i => (
                      <div key={i} class="bg-brandSurface rounded-xl overflow-hidden border border-white/5 animate-pulse">
                        <div class="aspect-video bg-white/5"></div>
                        <div class="p-3.5 space-y-2">
                          <div class="h-4 bg-white/10 rounded w-4/5"></div>
                          <div class="h-3 bg-white/5 rounded w-1/2"></div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {eventsStatus === 'error' && (
                  <div class="text-center py-12 px-6 bg-brandSurface rounded-xl border border-white/5">
                    <p class="text-white/70 mb-4 font-semibold text-sm">No pudimos conectar con la base de eventos.</p>
                    <button onClick={fetchEvents} class="bg-brandPurple text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-brandPurple/80 transition">
                      VOLVER A INTENTAR
                    </button>
                  </div>
                )}

                {eventsStatus === 'success' && eventos.length === 0 && (
                  <div class="text-center py-12 text-white/50 bg-brandSurface rounded-xl border border-white/5 text-sm">
                    No se registran eventos deportivos programados hoy.
                  </div>
                )}

                {eventsStatus === 'success' && eventos.length > 0 && (
                  <div class="grid grid-cols-2 lg:grid-cols-3 gap-4">
                    {eventos.map(ev => (
                      <div 
                        key={ev.id} 
                        onClick={() => {
                          if (ev.stream_url) {
                            playContent({
                              id: ev.id,
                              title: ev.titulo,
                              stream_url: ev.stream_url,
                              img: ev.imagen_url,
                              category: ev.liga || 'Eventos',
                              description: ev.descripcion || `Liga: ${ev.liga} - ${ev.titulo}`,
                              type: 'live'
                            });
                          } else {
                            triggerToast('Enlace de transmisión no ingresado todavía.');
                          }
                        }}
                        class="bg-brandSurface hover:bg-[#181824] transition-all rounded-xl overflow-hidden border border-white/5 cursor-pointer hover:scale-[1.02] duration-200 group flex flex-col justify-between"
                      >
                        <div class="relative aspect-video w-full bg-black/40 overflow-hidden">
                          {ev.imagen_url ? (
                            <img src={ev.imagen_url} alt={ev.titulo} class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                          ) : (
                            <div class="w-full h-full flex items-center justify-center bg-brandPurple/5">
                              <span class="font-title text-2xl text-brandPurple/40">VIDEX LIVE</span>
                            </div>
                          )}
                          
                          {/* Pulsing badge ALWAYS forced as LIVE based on Correction Rule #3 */}
                          <div class="absolute top-2 left-2 flex items-center space-x-1.5 bg-red-600 text-[10px] font-black uppercase text-white px-2.5 py-0.5 rounded-full live-pulse border border-red-500 shadow">
                            <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
                            <span>EN VIVO</span>
                          </div>

                          {ev.canal && (
                            <div class="absolute top-2 right-2 bg-brandGold text-black text-[9px] font-bold px-1.5 py-0.5 rounded shadow tracking-tight">
                              {ev.canal}
                            </div>
                          )}
                        </div>

                        <div class="p-3 flex-grow flex flex-col justify-between">
                          <h3 class="text-xs font-semibold text-white/95 line-clamp-2 leading-snug group-hover:text-brandGold transition mb-2">
                            {ev.titulo}
                          </h3>
                          <div class="text-[10px] text-white/50 space-y-0.5">
                            <div class="flex items-center space-x-1">
                              <span class="w-1.5 h-1.5 bg-brandPurple rounded-full"></span>
                              <span class="truncate font-semibold text-brandPurple uppercase">{ev.liga}</span>
                            </div>
                            <div class="flex items-center space-x-1 text-white/30 font-medium">
                              <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                              </svg>
                              <span>{ev.hora} ({ev.zona_horaria})</span>
                            </div>

    // Component: Core Custom HTML5 Media & HLS player container
    function VideoPlayer({ stream, triggerToast, onClosing, onRecordingAdded, config }) {
      const videoRef = useRef(null);
      const playerContainerRef = useRef(null);
      
      const [playing, setPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [volume, setVolume] = useState(1);
      const [muted, setMuted] = useState(false);
      const [fullscreen, setFullscreen] = useState(false);
      
      const [qualities, setQualities] = useState([]);
      const [selectedQuality, setSelectedQuality] = useState(-1);
      const [isQualityOpen, setIsQualityOpen] = useState(false);
 
      const [playbackError, setPlaybackError] = useState(null);
      const [isConnecting, setIsConnecting] = useState(true);
      const [reportModalOpen, setReportModalOpen] = useState(false);

      // Report Problem States and handlers conforming to Correction 3
      const [reportProblem, setReportProblem] = useState('Sin imagen');
      const [reportDesc, setReportDesc] = useState('');
      const [isSendingReport, setIsSendingReport] = useState(false);

      const handleSubmitReport = async () => {
        setIsSendingReport(true);
        try {
          const problemText = reportProblem;
          const queryParams = new URLSearchParams({
            canal: stream.title,
            problema: reportDesc ? `${problemText} - ${reportDesc}` : problemText,
            usuario: 'Anónimo'
          });
          const res = await fetch(`https://apio.videx.lol/reporte.php?${queryParams.toString()}`);
          if (!res.ok) throw new Error();
          
          const data = await res.json();
          if (data && data.duplicado) {
            triggerToast('⚠️ Ya reportaste este problema recientemente');
          } else {
            triggerToast('✅ Reporte enviado. ¡Gracias!');
          }
          setReportModalOpen(false);
          setReportDesc('');
        } catch (e) {
          triggerToast('❌ Error al enviar el reporte');
        } finally {
          setIsSendingReport(false);
        }
      };
 
      // Recording logic parameters
      const [isRecording, setIsRecording] = useState(false);
      const [recordingSeconds, setRecordingSeconds] = useState(0);
      const mediaRecorderRef = useRef(null);
      const recordedChunksRef = useRef([]);
      const recordingTimerRef = useRef(null);
 
      const hlsRef = useRef(null);
      const retryAttemptsRef = useRef(0);
      const maxRetryAttempts = 3;
 
      // Sintonizador de señal - Cascading Fallback (Safari direct m3u8 VS Hls.js VS Error handler)
      const initPlayer = () => {
        setIsConnecting(true);
        setPlaybackError(null);
        setQualities([]);
        setSelectedQuality(-1);
        setIsQualityOpen(false);
 
        const video = videoRef.current;
        if (!video) return;
 
        // Reset any previous hls instance
        if (hlsRef.current) {
          hlsRef.current.destroy();
          hlsRef.current = null;
        }
 
        const sourceUrl = stream.stream_url;
 
        // Fallback Cascading 1: Native iOS Safari browser support
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = sourceUrl;
          video.addEventListener('loadedmetadata', onLoadedMetadata);
          video.addEventListener('error', handleNativeVideoError);
        } 
        // Fallback Cascading 2: Standard desktop Chrome / Android System WebView using hls.js
        else if (Hls.isSupported()) {
          const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 90,
            xhrSetup: (xhr, url) => {
              xhr.withCredentials = false;
            }
          });
 
          hlsRef.current = hls;
          hls.loadSource(sourceUrl);
          hls.attachMedia(video);
 
          // Handle level selections (quality selector)
          hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
            setIsConnecting(false);
            if (data.levels && data.levels.length > 1) {
              setQualities(data.levels);
              
              // Apply preferred quality level (Alta, Media, Baja)
              const levels = data.levels;
              let finalLevel = -1; // Default Auto
              if (config && config.calidadPreferida === 'Alta') {
                finalLevel = levels.length - 1;
              } else if (config && config.calidadPreferida === 'Baja') {
                finalLevel = 0;
              } else if (config && config.calidadPreferida === 'Media') {
                finalLevel = Math.floor(levels.length / 2);
              }
              
              hls.currentLevel = finalLevel;
              setSelectedQuality(finalLevel);
            }
          });
 
          hls.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
            setSelectedQuality(data.level);
          });
 
          // Fallback Cascading 3: Error management & recoverMediaError routine
          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              console.warn('Fatal HLS content load error detected:', data.type);
              const shouldReconnect = config ? config.reconexionAutomatica : true;
              if (shouldReconnect && retryAttemptsRef.current < maxRetryAttempts) {
                retryAttemptsRef.current++;
                console.log(`Auto recover attempt ${retryAttemptsRef.current}...`);
                
                switch (data.type) {
                  case Hls.ErrorTypes.MEDIA_ERROR:
                    hls.recoverMediaError();
                    break;
                  default:
                    hls.startLoad();
                    break;
                }
              } else {
                // If exceeded attempt limit, trigger display
                setPlaybackError('Stream no disponible. Intenta más tarde.');
                setIsConnecting(false);
              }
            }
          });
        }
        else {
          // No stream player formats supported fallback
          setPlaybackError('Plataforma no soporta streaming multimedia hls.');
          setIsConnecting(false);
        }
      };

      const handleNativeVideoError = () => {
        if (retryAttemptsRef.current < maxRetryAttempts) {
          retryAttemptsRef.current++;
          setTimeout(initPlayer, 1500);
        } else {
          setPlaybackError('Stream no disponible. Intenta más tarde.');
          setIsConnecting(false);
        }
      };

      const onLoadedMetadata = () => {
        setIsConnecting(false);
        setDuration(videoRef.current.duration || 0);
      };

      useEffect(() => {
        retryAttemptsRef.current = 0;
        initPlayer();

        return () => {
          if (hlsRef.current) {
            hlsRef.current.destroy();
          }
          stopRecordingTimer();
        };
      }, [stream.stream_url]);

      // Fullscreen state listener checks conforming to Correction #1
      useEffect(() => {
        const handleFullscreenChange = () => {
          const isCurrentlyFs = !!(
            document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.mozFullScreenElement ||
            document.msFullscreenElement
          );
          setFullscreen(isCurrentlyFs);
        };

        const container = playerContainerRef.current;
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenChange);
        document.addEventListener('msfullscreenchange', handleFullscreenChange);

        return () => {
          document.removeEventListener('fullscreenchange', handleFullscreenChange);
          document.removeEventListener('webkitfullscreenchange', handleFullscreenChange);
          document.removeEventListener('mozfullscreenchange', handleFullscreenChange);
          document.removeEventListener('msfullscreenchange', handleFullscreenChange);
        };
      }, []);

      // Toggle Playback controls
      const togglePlay = () => {
        const video = videoRef.current;
        if (!video) return;

        if (playing) {
          video.pause();
          setPlaying(false);
        } else {
          video.play().then(() => {
            setPlaying(true);
          }).catch(() => {
            setPlaying(false);
          });
        }
      };

      // Progress Tracker
      const handleTimeUpdate = () => {
        if (!videoRef.current) return;
        setCurrentTime(videoRef.current.currentTime);
      };

      const handleSeek = (e) => {
        const video = videoRef.current;
        if (!video || !duration || duration === Infinity) return;
        const seekValue = parseFloat(e.target.value);
        video.currentTime = seekValue;
        setCurrentTime(seekValue);
      };

      const handleVolumeChange = (e) => {
        const val = parseFloat(e.target.value);
        setVolume(val);
        if (videoRef.current) {
          videoRef.current.volume = val;
          videoRef.current.muted = val === 0;
        }
        setMuted(val === 0);
      };

      const toggleMute = () => {
        const nextMute = !muted;
        setMuted(nextMute);
        if (videoRef.current) {
          videoRef.current.muted = nextMute;
        }
      };

      // Fullscreen cascading browser triggers
      const enterFullscreen = () => {
        const el = playerContainerRef.current;
        if (!el) return;

        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
        else {
          // iOS visual fallback
          el.classList.add('fixed', 'inset-0', 'w-screen', 'h-screen', 'z-[9999]', 'bg-black');
          setFullscreen(true);
        }
      };

      const exitFullscreen = () => {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
        
        // Remove iOS fallback classes
        const el = playerContainerRef.current;
        if (el) {
          el.classList.remove('fixed', 'inset-0', 'w-screen', 'h-screen', 'z-[9999]', 'bg-black');
        }
        setFullscreen(false);
      };

      const toggleFullscreen = () => {
        if (fullscreen) {
          exitFullscreen();
        } else {
          enterFullscreen();
        }
      };

      // Change Quality trigger
      const changeLevel = (levelIndex) => {
        if (hlsRef.current) {
          hlsRef.current.currentLevel = levelIndex;
        }
        setIsQualityOpen(false);
      };

      // Native WebApp share integration conforming to Correction 2
      const handleShare = () => {
        const shareTitle = 'VIDEX — Streaming';
        const shareText = `Mira de forma gratuita ${stream.title} en VIDEX`;
        const shareUrl = 'https://videx.lol';
        const msgToSend = `${shareTitle}\n${shareText}\n${shareUrl}`;

        if (window.AndroidInterface && window.AndroidInterface.shareContent) {
          window.AndroidInterface.shareContent(msgToSend);
        } else if (navigator.share) {
          navigator.share({
            title: shareTitle,
            text: shareText,
            url: shareUrl
          }).catch(() => {
            // Do nothing
          });
        } else {
          // Standard browser copy link fallback as defined in user specs
          navigator.clipboard.writeText(shareUrl).then(() => {
            triggerToast('🔗 Enlace copiado: videx.lol');
          }).catch(() => {
            triggerToast('Error al copiar el enlace.');
          });
        }
      };

      // Format seconds beautifully helper
      const formatTime = (secs) => {
        if (isNaN(secs) || secs === Infinity) return "LIVE";
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = Math.floor(secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const formatCounter = (totalSecs) => {
        const hrs = Math.floor(totalSecs / 3600).toString().padStart(2, '0');
        const mins = Math.floor((totalSecs % 3600) / 60).toString().padStart(2, '0');
        const secs = Math.floor(totalSecs % 60).toString().padStart(2, '0');
        return `${hrs}:${mins}:${secs}`;
      };

      // Recording seconds reference to solve closure stale state bugs
      const recordingSecondsRef = useRef(0);

      // Capturing recorder logic conforming to Correction #1
      const startRecording = () => {
        const videoEl = videoRef.current;
        if (!videoEl) return;

        try {
          recordedChunksRef.current = [];
          recordingSecondsRef.current = 0;
          setRecordingSeconds(0);
          
          const streamObj = videoEl.captureStream
            ? videoEl.captureStream()
            : videoEl.mozCaptureStream
            ? videoEl.mozCaptureStream()
            : null;

          if (!streamObj) {
            triggerToast('Tu navegador no soporta grabación');
            return;
          }

          const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
            ? 'video/webm;codecs=vp9'
            : MediaRecorder.isTypeSupported('video/webm')
            ? 'video/webm'
            : '';

          const recorder = new MediaRecorder(streamObj, mimeType ? { mimeType } : {});

          mediaRecorderRef.current = recorder;

          recorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              recordedChunksRef.current.push(event.data);
            }
          };

          recorder.onstop = () => {
            const blob = new Blob(recordedChunksRef.current, { type: mimeType || 'video/webm' });
            const fileName = `videx_rec_${Date.now()}.webm`;
            const nowStr = new Date().toLocaleString();
            const durFormatted = formatCounter(recordingSecondsRef.current);

            // Convert to base64 to leverage native bridge or fallback matching
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
              const base64Content = reader.result.split(',')[1];
              
              if (window.AndroidInterface && window.AndroidInterface.saveRecording) {
                window.AndroidInterface.saveRecording(base64Content, fileName);
              } else {
                // Browser testing fallback downloads
                const blobUrl = URL.createObjectURL(blob);
                const tag = document.createElement('a');
                tag.href = blobUrl;
                tag.download = fileName;
                tag.click();
                triggerToast('Grabación descargada en el dispositivo.');
              }

              // Update localStorage catalog database listing conforming to Correction #1
              const currentList = JSON.parse(localStorage.getItem('videx_grabaciones') || '[]');
              const blobUrlLocal = URL.createObjectURL(blob); // available temporary for this tab session only
              
              const newReg = {
                id: Date.now().toString(),
                titulo: stream.title,
                fecha: nowStr,
                duracion: durFormatted,
                archivo: fileName,
                blobUrl: blobUrlLocal
              };

              currentList.unshift(newReg);
              localStorage.setItem('videx_grabaciones', JSON.stringify(currentList));
              
              // Callback update
              if (onRecordingAdded) onRecordingAdded();
            };
          };

          recorder.start(1000); // chunk slices
          setIsRecording(true);
          
          startRecordingTimer();
          triggerToast('Comenzó la grabación de la transmisión.');
        } catch (err) {
          console.error(err);
          triggerToast('Error al inicializar captura multimedia.');
        }
      };

      const startRecordingTimer = () => {
        stopRecordingTimer();
        recordingTimerRef.current = setInterval(() => {
          recordingSecondsRef.current += 1;
          setRecordingSeconds(recordingSecondsRef.current);
        }, 1000);
      };

      const stopRecordingTimer = () => {
        if (recordingTimerRef.current) {
          clearInterval(recordingTimerRef.current);
          recordingTimerRef.current = null;
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
          stopRecordingTimer();
          triggerToast('Procesando y guardando archivo...');
        }
      };

      return (
        <div class="space-y-4">
          
          {/* Main player box containing HTML5 Canvas / Video elements and custom bar overlay */}
          <div 
            ref={playerContainerRef} 
            class={`relative bg-black rounded-2xl overflow-hidden aspect-video border border-white/10 group flex flex-col justify-between ${
              fullscreen ? 'w-screen h-screen rounded-none' : ''
            }`}
          >
            {/* Native Video Element */}
            <video 
              ref={videoRef}
              onClick={togglePlay}
              onTimeUpdate={handleTimeUpdate}
              class="w-full h-full object-contain cursor-pointer flex-grow"
              playsInline
              webkit-playsinline="true"
            />

            {/* Connecting view spinner */}
            {isConnecting && (
              <div class="absolute inset-0 bg-[#0a0a0f]/90 z-10 flex flex-col items-center justify-center space-y-2">
                <div class="w-8 h-8 border-3 border-brandGold border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs text-white/40 tracking-widest font-title uppercase">Sintonizando Señal...</p>
              </div>
            )}

            {/* Playback Errors visual feedback */}
            {playbackError && (
              <div class="absolute inset-0 bg-[#0c0c12]/95 z-10 flex flex-col items-center justify-center p-6 text-center">
                <p class="text-xs text-red-400 font-bold mb-3 uppercase tracking-wider">⚠️ Sintonización Fallida</p>
                <p class="text-sm text-white/80 max-w-sm mb-4">{playbackError}</p>
                <button 
                  onClick={initPlayer}
                  class="bg-brandGold text-black font-extrabold text-xs px-4 py-2 rounded-xl hover:bg-brandGold/90 transition shadow-lg shadow-brandGold/15"
                >
                  REINTENTAR SINTONIZACIÓN
                </button>
              </div>
            )}

            {/* Recorder current counter feedback top left banner */}
            {isRecording && (
              <div class="absolute top-4 left-4 z-20 flex items-center space-x-1.5 bg-red-600 border border-red-500 text-[10px] font-black tracking-widest uppercase text-white px-2.5 py-1 rounded-full live-pulse shadow">
                <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
                <span>REC {formatCounter(recordingSeconds)}</span>
              </div>
            )}

            {/* CUSTOM PLAYER BAR OVERLAY (Hidden in normal, shown on mouse overlay or always touch elements) */}
            <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent p-3 pt-6 flex flex-col space-y-2 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition duration-300 z-10">
              
              {/* VOD Progress bar controller vs LIVE status Indicator */}
              <div class="flex items-center space-x-2 pb-1.5">
                {duration && duration !== Infinity ? (
                  <div class="flex items-center space-x-2 w-full">
                    <span class="text-[10px] font-semibold text-white/60">{formatTime(currentTime)}</span>
                    <input 
                      type="range" 
                      min="0" 
                      max={duration || 100} 
                      step="0.1"
                      value={currentTime}
                      onChange={handleSeek}
                      class="flex-grow accent-brandGold h-1 rounded bg-white/20 outline-none cursor-pointer"
                    />
                    <span class="text-[10px] font-semibold text-white/60">{formatTime(duration)}</span>
                  </div>
                ) : (
                  <div class="flex items-center space-x-1.5 py-1 px-2.5 rounded-full bg-red-600/25 border border-red-500/20">
                    <span class="w-2 h-2 bg-red-500 rounded-full live-pulse"></span>
                    <span class="text-[9px] font-black uppercase text-red-500 tracking-widest leading-none">SEÑAL EN VIVO</span>
                  </div>
                )}
              </div>

              {/* Core controls */}
              <div class="flex items-center justify-between">
                
                {/* Play / Close container */}
                <div class="flex items-center space-x-3">
                  <button onClick={togglePlay} class="text-white hover:text-brandGold transition p-1" title="Reproducir/Pausar">
                    {playing ? (
                      <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                      </svg>
                    ) : (
                      <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                      </svg>
                    )}
                  </button>

                  {/* Volume Slider controller */}
                  <div class="flex items-center space-x-1.5 group/vol">
                    <button onClick={toggleMute} class="text-white hover:text-brandGold transition p-1">
                      {muted || volume === 0 ? (
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6L4.5 9H1.5v6h3l4.5 3.75V3.75z" />
                        </svg>
                      ) : (
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
                        </svg>
                      )}
                    </button>
                    
                    <input 
                      type="range" 
                      min="0" 
                      max="1" 
                      step="0.05"
                      value={muted ? 0 : volume}
                      onChange={handleVolumeChange}
                      class="w-16 accent-white h-0.5 rounded cursor-pointer hidden sm:block opacity-0 group-hover/vol:opacity-100 transition-opacity"
                    />
                  </div>
                </div>

                {/* Sub features bar (Quality, Save, Share, Report, FullScreen) */}
                <div class="flex items-center space-x-2.5">
                  
                  {/* Quality levels selector - ONLY if playlist contains multiple configurations conform to Rule #3 */}
                  {qualities.length > 0 && (
                    <div class="relative">
                      <button 
                        onClick={() => setIsQualityOpen(!isQualityOpen)}
                        class="text-[10px] font-bold bg-white/10 hover:bg-[#1a1a26] border border-white/10 px-2 py-1 rounded text-white active:scale-95 transition"
                      >
                        ⚙️ {selectedQuality === -1 ? 'AUTO' : `${qualities[selectedQuality].height}P`}
                      </button>

                      {isQualityOpen && (
                        <div class="absolute bottom-full right-0 mb-2 bg-[#0c0c12] border border-white/10 rounded-xl p-1.5 shadow-2xl flex flex-col space-y-1 min-w-[100px] z-[99]">
                          <button 
                            onClick={() => changeLevel(-1)}
                            class={`text-left text-[9px] font-bold px-2 py-1 rounded transition uppercase ${
                              selectedQuality === -1 ? 'text-brandGold bg-brandGold/10' : 'text-white/60 hover:bg-white/5'
                            }`}
                          >
                            AUTOMÁTICO
                          </button>
                          {qualities.map((item, idx) => (
                            <button
                              key={idx}
                              onClick={() => changeLevel(idx)}
                              class={`text-left text-[9px] font-bold px-2 py-1 rounded transition ${
                                selectedQuality === idx ? 'text-brandGold bg-brandGold/10' : 'text-white/60 hover:bg-white/5'
                              }`}
                            >
                              {item.height}P ({Math.round(item.bitrate / 1000)}kbps)
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* Detener vs Comienza Grabar conform to Correction #4 */}
                  {stream.type !== 'recorded' && (
                    isRecording ? (
                      <button 
                        onClick={stopRecording}
                        class="bg-red-600 border border-red-500 text-white p-1 rounded-lg hover:scale-105 transition"
                        title="Detener Grabación"
                      >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 7.5A2.25 2.25 0 017.5 5.25h9a2.25 2.25 0 012.25 2.25v9a2.25 2.25 0 01-2.25 2.25h-9a2.25 2.25 0 01-2.25-2.25v-9z" />
                        </svg>
                      </button>
                    ) : (
                      <button 
                        onClick={startRecording}
                        class="bg-white/10 hover:bg-white/20 text-white p-1.5 rounded-lg active:scale-95 transition"
                        title="Capturar/Grabar Transmisión"
                      >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6.75 6.75 0 100-13.5 6.75 6.75 0 000 13.5z" />
                        </svg>
                      </button>
                    )
                  )}

                  {/* Share button banner */}
                  <button onClick={handleShare} class="bg-white/10 hover:bg-white/20 text-white p-1.5 rounded-lg transition" title="Compartir Señal">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z" />
                    </svg>
                  </button>

                  {/* Report option */}
                  <button onClick={() => setReportModalOpen(true)} class="bg-white/10 hover:bg-white/20 text-white p-1.5 rounded-lg transition" title="Reportar Falla">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                    </svg>
                  </button>

                  {/* FullScreen button triggers */}
                  <button onClick={toggleFullscreen} class="text-white hover:text-brandGold transition p-1" title="Pantalla Completa">
                    {fullscreen ? (
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3 3m12 6V4.5M15 9h4.5M15 9l6-6m-6 12v4.5m0-4.5h4.5m-4.5 0l6 6M9 15v4.5M9 15H4.5m4.5 0l-6 6" />
                      </svg>
                    ) : (
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75v4.5m0-4.5h-4.5m4.5 0L15 9m5.25 11.25v-4.5m0 4.5h-4.5m4.5 0L15 15" />
                      </svg>
                    )}
                  </button>
                </div>

              </div>
            </div>

          </div>

          {/* Under player descriptions and actions */}
          <div class="px-3 sm:px-0 flex justify-between items-start">
            <div class="space-y-1">
              <span class="inline-block bg-brandPurple/10 text-brandPurple border border-brandPurple/20 text-[9px] font-black tracking-widest px-2.5 py-0.5 rounded uppercase">
                {stream.category}
              </span>
              <h2 class="text-base font-extrabold text-white leading-snug uppercase">{stream.title}</h2>
              {stream.description && (
                <p class="text-xs text-white/50 leading-relaxed max-w-2xl select-text">{stream.description}</p>
              )}
            </div>

            <button 
              onClick={onClosing}
              class="flex items-center space-x-1.5 bg-brandBg border border-white/5 hover:bg-white/5 transition text-[10px] font-black px-3.5 py-2 rounded-xl text-white uppercase tracking-wider"
          {reportModalOpen && (
            <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in text-white">
              <div class="bg-brandSurface border border-white/10 rounded-2xl p-5 w-full max-w-sm relative flex flex-col select-none">
                <h4 class="text-xs font-black uppercase tracking-widest text-brandGold mb-4 flex items-center space-x-1.5 border-b border-white/5 pb-2">
                  <span>⚠️</span>
                  <span>Reportar Falla de Transmisión</span>
                </h4>
                
                {/* Problema Selector */}
                <div class="mb-4">
                  <label class="block text-[10px] font-extrabold uppercase tracking-widest text-[#7c3aed] mb-1.5">Problema</label>
                  <select 
                    value={reportProblem} 
                    onChange={(e) => setReportProblem(e.target.value)}
                    class="w-full bg-[#0a0a0f] text-xs text-white/95 border border-white/10 rounded-xl px-3.5 py-2.5 focus:border-[#7c3aed] focus:outline-none transition font-semibold"
                  >
                    {["Sin imagen", "Sin sonido", "Buffering excesivo", "Stream caído", "Otro"].map((opt) => (
                      <option key={opt} value={opt} class="bg-brandSurface text-xs">{opt}</option>
                    ))}
                  </select>
                </div>

                {/* Descripción adicional Textarea */}
                <div class="mb-5">
                  <label class="block text-[10px] font-extrabold uppercase tracking-widest text-[#7c3aed] mb-1.5">Descripción adicional (Opcional)</label>
                  <textarea 
                    value={reportDesc}
                    onChange={(e) => setReportDesc(e.target.value)}
                    rows="3"
                    placeholder="Escribe detalles sobre la falla..."
                    class="w-full bg-[#0a0a0f] text-xs text-white border border-white/10 rounded-xl p-3 focus:border-[#7c3aed] focus:outline-none transition leading-relaxed"
                  ></textarea>
                </div>

                {/* Submitting vs Cancel footer */}
                <div class="grid grid-cols-2 gap-2 mt-2">
                  <button 
                    onClick={() => setReportModalOpen(false)}
                    disabled={isSendingReport}
                    class="bg-[#1c1c2b] hover:bg-white/5 disabled:opacity-50 transition border border-white/5 text-white/50 hover:text-white font-extrabold uppercase text-[9px] tracking-widest py-2.5 rounded-xl text-center"
                  >
                    CANCELAR
                  </button>
                  <button 
                    onClick={handleSubmitReport}
                    disabled={isSendingReport}
                    class="bg-brandGold hover:bg-brandGold/90 disabled:opacity-50 transition text-black font-extrabold uppercase text-[9px] tracking-widest py-2.5 rounded-xl text-center shadow-lg shadow-brandGold/20 flex items-center justify-center space-x-1"
                  >
                    {isSendingReport ? (
                      <span>ENVIANDO...</span>
                    ) : (
                      <span>ENVIAR REPORTE</span>
                    )}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount to absolute system root entry
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
