<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VIDEX APP</title>

  <!-- Google Fonts: Bebas Neue for headings, Barlow for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- hls.js for HLS streaming support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.10/hls.min.js"></script>

  <style>
    /* Premium Application Shell Theme Adjustments */
    body {
      background-color: #0a0a0f;
      color: #ffffff;
      font-family: 'Barlow', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-title {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.05em;
    }
    /* Hide scrollbars elegantly */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a0f;
    }
    ::-webkit-scrollbar-thumb {
      background: #3b3b4f;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f5c518;
    }
    /* Custom animation for pulsating red live dot */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.1); }
    }
    .custom-pulse {
      animation: pulse 1.2s infinite ease-in-out;
    }
  </style>

  <script>
    // Tailwind Custom Configuration Setup
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBg: '#0a0a0f',
            brandSurface: '#12121a',
            brandGold: '#f5c518',
            brandPurple: '#7c3aed',
          }
        }
      }
    };
  </script>
</head>
<body class="bg-[#0a0a0f]">
  <div id="root"></div>

  <!-- React JSX Application Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Toast Notification Component
    function Toast({ message, onClose }) {
      useEffect(() => {
        const timer = setTimeout(onClose, 3000);
        return () => clearTimeout(timer);
      }, [onClose]);

      return (
        <div class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-brandPurple/95 border border-white/20 text-white font-semibold py-3 px-6 rounded-full shadow-2xl backdrop-blur-md text-sm z-50 flex items-center space-x-2 animate-bounce">
          <span>{message}</span>
        </div>
      );
    }

    // Main App Container
    function App() {
      const [activeTab, setActiveTab] = useState('en_vivo');
      const [currentStream, setCurrentStream] = useState(null); // { id, title, stream_url, img, category, description, type }
      const [toastMsg, setToastMsg] = useState('');

      // Events States
      const [eventos, setEventos] = useState([]);
      const [eventsStatus, setEventsStatus] = useState('loading'); // loading, success, error

      // Channels States
      const [canales, setCanales] = useState([]);
      const [channelsStatus, setChannelsStatus] = useState('loading'); // loading, success, error
      const [channelSearch, setChannelSearch] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todos');

      // Movies States
      const [movieSearch, setMovieSearch] = useState('');
      const [movieResults, setMovieResults] = useState([]);
      const [moviesSearchStatus, setMoviesSearchStatus] = useState('idle'); // idle, loading, success, error
      const [selectedMovie, setSelectedMovie] = useState(null);
      const [movieDetailsStatus, setMovieDetailsStatus] = useState('idle');
      const [movieSubTab, setMovieSubTab] = useState('search'); // search, recordings
      const [recordings, setRecordings] = useState([]);

      // Trigger standard / native Toasts
      const showToast = (msg) => {
        if (window.AndroidInterface && window.AndroidInterface.showToast) {
          window.AndroidInterface.showToast(msg);
        } else {
          setToastMsg(msg);
        }
      };

      // Load recordings history from localStorage
      const loadRecordings = () => {
        try {
          const stored = localStorage.getItem('videx_recordings');
          if (stored) {
            setRecordings(JSON.parse(stored));
          } else {
            setRecordings([]);
          }
        } catch (e) {
          console.error("Error holding recordings", e);
        }
      };

      useEffect(() => {
        loadRecordings();
      }, []);

      // FETCH EVENTS
      const fetchEvents = async () => {
        setEventsStatus('loading');
        try {
          const res = await fetch('https://apio.videx.lol/eventosss.json');
          if (!res.ok) throw new Error('API Error');
          const data = await res.json();
          setEventos(data.eventos || []);
          setEventsStatus('success');
        } catch (e) {
          console.error(e);
          setEventsStatus('error');
        }
      };

      // FETCH CHANNELS
      const fetchChannels = async () => {
        setChannelsStatus('loading');
        try {
          const res = await fetch('https://apio.videx.lol/canales.json');
          if (!res.ok) throw new Error('API Error');
          const data = await res.json();
          // Extract nested 'canal' structure
          const parsed = data.canales ? data.canales.map(item => item.canal).filter(Boolean) : [];
          setCanales(parsed);
          setChannelsStatus('success');
        } catch (e) {
          console.error(e);
          setChannelsStatus('error');
        }
      };

      useEffect(() => {
        fetchEvents();
        fetchChannels();
      }, []);

      // Channels category list extracted dynamically
      const categories = useMemo(() => {
        const list = ['Todos'];
        canales.forEach(item => {
          if (item.categoria && !list.includes(item.categoria)) {
            list.push(item.categoria);
          }
        });
        return list;
      }, [canales]);

      // Debounced search for movies
      useEffect(() => {
        if (!movieSearch.trim()) {
          setMovieResults([]);
          setMoviesSearchStatus('idle');
          return;
        }

        setMoviesSearchStatus('loading');
        const delayDebounceFn = setTimeout(async () => {
          try {
            const res = await fetch(`https://apio.videx.lol/movies/sk.php?q=${encodeURIComponent(movieSearch)}`);
            if (!res.ok) throw new Error('Search failed');
            const data = await res.json();
            setMovieResults(data.results || []);
            setMoviesSearchStatus('success');
          } catch (e) {
            console.error(e);
            setMoviesSearchStatus('error');
          }
        }, 500);

        return () => clearTimeout(delayDebounceFn);
      }, [movieSearch]);

      // Fetch Movie/Series details
      const handleSelectMovieResult = async (item) => {
        setMovieDetailsStatus('loading');
        setSelectedMovie(null);
        try {
          const res = await fetch(`https://apio.videx.lol/movies/v3.php?url=${encodeURIComponent(item.url)}`);
          if (!res.ok) throw new Error('Details loading failed');
          const data = await res.json();
          setSelectedMovie(data);
          setMovieDetailsStatus('success');
        } catch (e) {
          console.error(e);
          setMovieDetailsStatus('error');
          showToast('Error al cargar detalles de la película/serie');
        }
      };

      // Play selected stream
      const selectStream = (stream) => {
        setCurrentStream(stream);
        setActiveTab('reproductor');
      };

      return (
        <div class="flex flex-col min-h-screen bg-[#0a0a0f] text-white">
          
          {/* Top Branding Header */}
          <header class="bg-[#12121a]/95 border-b border-white/5 py-4 px-6 flex justify-between items-center sticky top-0 z-30 backdrop-blur-md">
            <div class="flex items-center space-x-2">
              <span class="w-2.5 h-6 bg-brandGold rounded-full"></span>
              <h1 class="text-2xl font-black font-title text-white tracking-widest">
                VIDEX<span class="text-brandGold">APP</span>
              </h1>
            </div>
            {currentStream && activeTab !== 'reproductor' && (
              <button 
                onClick={() => setActiveTab('reproductor')}
                class="flex items-center space-x-1.5 bg-brandPurple hover:bg-brandPurple/80 transition text-xs font-semibold px-3 py-1.5 rounded-full text-white shadow-md animate-pulse"
              >
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                  <path d="M8 5v14l11-7z"/>
                </svg>
                <span>REPRODUCTOR</span>
              </button>
            )}
          </header>

          {/* Main Module Content Area */}
          <main class="flex-grow pb-28">
            
            {/* TABS 1 — EN VIVO */}
            {activeTab === 'en_vivo' && (
              <div class="px-4 py-5">
                <div class="flex items-center justify-between mb-5">
                  <div class="flex items-center space-x-2">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-red-600"></span>
                    </span>
                    <h2 class="text-xl font-bold font-title tracking-wider text-red-500">EVENTOS DEPORTIVOS</h2>
                  </div>
                  <button onClick={fetchEvents} class="text-white/40 hover:text-white p-1 rounded-full transition bg-white/5 hover:bg-white/10">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.213 15h-3.07" />
                    </svg>
                  </button>
                </div>

                {eventsStatus === 'loading' && (
                  <div class="grid grid-cols-2 lg:grid-cols-3 gap-4">
                    {[1, 2, 4, 6].map(i => (
                      <div key={i} class="bg-[#12121a] rounded-xl overflow-hidden border border-white/5 animate-pulse">
                        <div class="aspect-video bg-white/5"></div>
                        <div class="p-3 space-y-2">
                          <div class="h-4 bg-white/10 rounded w-3/4"></div>
                          <div class="h-3 bg-white/5 rounded w-1/2"></div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {eventsStatus === 'error' && (
                  <div class="text-center py-12 px-6 bg-[#12121a] rounded-xl border border-white/5">
                    <p class="text-white/70 mb-4">Error al cargar los eventos de transmisiones en vivo.</p>
                    <button onClick={fetchEvents} class="bg-brandPurple text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-brandPurple/80 transition">
                      Reintentar conexión
                    </button>
                  </div>
                )}

                {eventsStatus === 'success' && eventos.length === 0 && (
                  <div class="text-center py-12 text-white/50 bg-[#12121a] rounded-xl border border-white/5">
                    No hay eventos activos en este momento.
                  </div>
                )}

                {eventsStatus === 'success' && eventos.length > 0 && (
                  <div class="grid grid-cols-2 lg:grid-cols-3 gap-4">
                    {eventos.map(ev => (
                      <div 
                        key={ev.id} 
                        onClick={() => {
                          if (ev.stream_url) {
                            selectStream({
                              id: ev.id,
                              title: ev.titulo,
                              stream_url: ev.stream_url,
                              img: ev.imagen_url,
                              category: ev.liga,
                              description: ev.descripcion || `${ev.liga} - ${ev.titulo}`,
                              type: 'live'
                            });
                          } else {
                            showToast('Stream no disponible para este evento.');
                          }
                        }}
                        class="bg-[#12121a] hover:bg-[#181826] transition rounded-xl overflow-hidden border border-white/5 cursor-pointer hover:scale-[1.02] duration-200 group flex flex-col justify-between"
                      >
                        <div class="relative aspect-video w-full bg-black/40">
                          {ev.imagen_url ? (
                            <img src={ev.imagen_url} alt={ev.titulo} class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                          ) : (
                            <div class="w-full h-full flex items-center justify-center bg-brandPurple/10">
                              <span class="font-title text-2xl text-brandPurple/50">TRANS</span>
                            </div>
                          )}
                          
                          {/* Top Left Status Badge */}
                          <div class="absolute top-2 left-2 flex items-center space-x-1 bg-red-600 text-[10px] font-black uppercase text-white px-2 py-0.5 rounded-full custom-pulse border border-red-500">
                            <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
                            <span>EN VIVO</span>
                          </div>

                          {/* Top Right Channel Badge */}
                          {ev.canal && (
                            <div class="absolute top-2 right-2 bg-brandGold text-[#000000] text-[10px] font-black uppercase px-2 py-0.5 rounded shadow">
                              {ev.canal}
                            </div>
                          )}
                        </div>

                        <div class="p-3 flex-grow flex flex-col justify-between">
                          <h3 class="text-sm font-semibold text-white line-clamp-2 leading-tight group-hover:text-brandGold transition mb-2">
                            {ev.titulo}
                          </h3>
                          <div class="text-[11px] text-white/50 space-y-1">
                            <div class="flex items-center space-x-1">
                              <span class="w-1.5 h-1.5 bg-brandPurple rounded-full"></span>
                              <span class="truncate font-semibold text-brandPurple">{ev.liga}</span>
                            </div>
                            <div class="flex items-center space-x-1 text-white/40">
                              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                              </svg>
                              <span>{ev.hora} ({ev.zona_horaria})</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TABS 2 — CANALES */}
            {activeTab === 'canales' && (
              <div class="px-4 py-5">
                <h2 class="text-xl font-bold font-title tracking-wider text-brandGold mb-4">CANALES DE TELEVISIÓN</h2>

                {/* Sticky Search bar */}
                <div class="sticky top-16 z-20 bg-[#0a0a0f] py-2 mb-4">
                  <div class="relative">
                    <input 
                      type="text" 
                      placeholder="Buscar canales por nombre o categoría..." 
                      value={channelSearch}
                      onChange={(e) => setChannelSearch(e.target.value)}
                      class="w-full bg-[#12121a] hover:bg-[#181826] text-white placeholder-white/40 rounded-xl py-3 pl-11 pr-4 border border-white/10 outline-none focus:border-brandGold transition text-sm shadow"
                    />
                    <svg class="w-5 h-5 absolute left-4 top-3.5 text-white/45" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                  </div>
                </div>

                {/* Categories Flowing list CHIPS */}
                <div class="flex overflow-x-auto pb-4 gap-2 scroll-smooth select-none">
                  {categories.map((cat) => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      class={`px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all duration-200 ${
                        selectedCategory === cat 
                          ? 'bg-brandGold text-[#0a0a0f]' 
                          : 'bg-[#12121a] text-white/70 hover:bg-white/5 border border-white/5'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                {channelsStatus === 'loading' && (
                  <div class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 mt-2">
                    {[1, 2, 3, 4, 5, 6].map(i => (
                      <div key={i} class="bg-[#12121a] aspect-square rounded-xl flex flex-col justify-between p-3 border border-white/5 animate-pulse">
                        <div class="w-12 h-12 rounded-full bg-white/5 mx-auto"></div>
                        <div class="h-3 bg-white/10 rounded w-3/4 mx-auto"></div>
                      </div>
                    ))}
                  </div>
                )}

                {channelsStatus === 'error' && (
                  <div class="text-center py-12 px-6 bg-[#12121a] rounded-xl border border-white/5">
                    <p class="text-white/70 mb-4 font-semibold">Error al conectar con los canales de transmisión.</p>
                    <button onClick={fetchChannels} class="bg-brandGold text-black font-semibold px-4 py-2 rounded-lg text-sm hover:bg-brandGold/80 transition">
                      Reintentar conexión
                    </button>
                  </div>
                )}

                {channelsStatus === 'success' && (
                  (() => {
                    // Filter logic
                    const filtered = canales.filter(ch => {
                      const matchesCategory = selectedCategory === 'Todos' || ch.categoria === selectedCategory;
                      const matchesText = !channelSearch.trim() || 
                        ch.nombre?.toLowerCase().includes(channelSearch.toLowerCase()) || 
                        ch.categoria?.toLowerCase().includes(channelSearch.toLowerCase());
                      return matchesCategory && matchesText;
                    });

                    if (filtered.length === 0) {
                      return (
                        <div class="text-center py-12 text-white/40">
                          No se encontraron canales que coincidan con la búsqueda.
                        </div>
                      );
                    }

                    return (
                      <div class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                        {filtered.map(ch => {
                          const isLogoAvailable = ch.img || ch.logo_url;
                          const logoSrc = ch.img || ch.logo_url;
                          const isActive = ch.activo !== false;

                          return (
                            <div 
                              key={ch.id}
                              onClick={() => {
                                if (!isActive) {
                                  showToast('Este canal es premium o inactivo temporalmente.');
                                  return;
                                }
                                selectStream({
                                  id: ch.id,
                                  title: ch.nombre,
                                  stream_url: ch.stream_url,
                                  img: logoSrc,
                                  category: ch.categoria || 'Canales',
                                  description: ch.descripcion || `Transmisión en vivo de ${ch.nombre}.`,
                                  type: 'channel'
                                });
                              }}
                              class={`relative bg-[#12121a]/90 rounded-xl p-3 flex flex-col items-center justify-between min-h-[140px] border cursor-pointer hover:scale-[1.05] transition-all duration-200 ${
                                isActive 
                                  ? 'border-white/5 hover:bg-[#181826] hover:border-brandPurple' 
                                  : 'opacity-50 grayscale border-red-500/10'
                              }`}
                            >
                              {/* Corner Badges */}
                              <div class="absolute top-1.5 left-1.5 flex flex-col space-y-1">
                                {ch.resolucion && (
                                  <span class="bg-white/10 text-white border border-white/10 font-bold text-[8px] tracking-tight px-1 py-0.2 rounded">
                                    {ch.resolucion}
                                  </span>
                                )}
                              </div>

                              {ch.es_premium && (
                                <div class="absolute top-1.5 right-1.5 bg-brandGold text-[#000000] font-black text-[8px] py-0.2 px-1 rounded">
                                  PREMIUM
                                </div>
                              )}

                              {/* Logo view */}
                              <div class="w-16 h-16 flex items-center justify-center rounded-2xl bg-black/40 overflow-hidden my-auto p-1 text-center">
                                {isLogoAvailable ? (
                                  <img src={logoSrc} alt={ch.nombre} class="max-w-full max-h-full object-contain" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />
                                ) : (
                                  <div class="flex flex-col items-center">
                                    <svg class="w-8 h-8 text-white/20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 4v16M17 4v16M3 8h18M3 16h18" />
                                    </svg>
                                  </div>
                                )}
                              </div>

                              <span class="text-xs font-bold text-white/90 truncate text-center w-full uppercase mt-2">
                                {ch.nombre}
                              </span>

                              {/* Locked Overlay */}
                              {!isActive && (
                                <div class="absolute inset-0 bg-brandBg/80 backdrop-blur-[1px] rounded-xl flex items-center justify-center">
                                  <div class="bg-red-500/20 border border-red-500/30 p-2 rounded-full text-red-500">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                    </svg>
                                  </div>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    );
                  })()
                )}
              </div>
            )}

            {/* TABS 3 — PELÍCULAS & SERIES & REPETICIONES */}
            {activeTab === 'peliculas' && (
              <div class="px-4 py-5">
                
                {/* Switcher Header: Películas Search vs. Grabaciones History */}
                <div class="flex border-b border-white/5 mb-5 select-none">
                  <button 
                    onClick={() => setMovieSubTab('search')}
                    class={`flex-1 py-3 text-center text-sm font-semibold tracking-wider font-title flex items-center justify-center space-x-1.5 transition ${
                      movieSubTab === 'search' 
                        ? 'text-brandGold border-b-2 border-brandGold font-bold' 
                        : 'text-white/40'
                    }`}
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" d="M7 4v16M17 4v16M3 8h18M3 16h18" />
                    </svg>
                    <span>BUSCADOR PELÍCULAS</span>
                  </button>
                  <button 
                    onClick={() => {
                      loadRecordings();
                      setMovieSubTab('recordings');
                    }}
                    class={`flex-1 py-3 text-center text-sm font-semibold tracking-wider font-title flex items-center justify-center space-x-1.5 transition ${
                      movieSubTab === 'recordings' 
                        ? 'text-brandPurple border-b-2 border-brandPurple font-bold' 
                        : 'text-white/40'
                    }`}
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>REC (REPETICIONES)</span>
                  </button>
                </div>

                {/* Sub tab: Search Movie/Series */}
                {movieSubTab === 'search' && (
                  <div>
                    {/* Centered Large Search Input */}
                    <div class="bg-[#12121a]/60 border border-white/5 rounded-2xl p-6 text-center max-w-xl mx-auto mb-6 shadow-md backdrop-blur-sm">
                      <h3 class="text-3xl font-black font-title tracking-widest text-[#ffffff] mb-1">CINE ILIMITADO</h3>
                      <p class="text-xs text-white/40 mb-4 uppercase tracking-widest">Servidor global HD</p>
                      
                      <div class="relative">
                        <input 
                          type="text" 
                          placeholder="Escribe el nombre de la película o serie..." 
                          value={movieSearch}
                          onChange={(e) => setMovieSearch(e.target.value)}

    // High performance VideoPlayer Component
    function VideoPlayer({ stream, onShowToast, onRecordingAdded }) {
      const videoRef = useRef(null);
      const containerRef = useRef(null);

      const [isPlaying, setIsPlaying] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const [volume, setVolume] = useState(0.85);
      const [videoProgress, setVideoProgress] = useState(0);
      const [videoDuration, setVideoDuration] = useState(0);
      const [showReportModal, setShowReportModal] = useState(false);

      // Media Quality & levels tracking
      const [qualities, setQualities] = useState([]);
      const [currentQualityIdx, setCurrentQualityIdx] = useState(-1); // -1 = Auto
      const [showQualityMenu, setShowQualityMenu] = useState(false);

      // Recording Tracking
      const [isRecording, setIsRecording] = useState(false);
      const [recordSeconds, setRecordSeconds] = useState(0);

      const mediaRecorderRef = useRef(null);
      const recordingChunksRef = useRef([]);
      const timerRef = useRef(null);
      const hlsRef = useRef(null);

      // Report checked types
      const [reportChecked, setReportChecked] = useState({
        noImg: false,
        noSnd: false,
        noBuff: false,
        noStrm: false
      });
      const [reportMsg, setReportMsg] = useState('');

      // Auto Retry loading logic parameters
      const retryCountRef = useRef(0);
      const maxRetries = 4;

      // Handle stream resolution & playback bindings
      useEffect(() => {
        const video = videoRef.current;
        if (!video || !stream.stream_url) return;

        // Reset variables
        retryCountRef.current = 0;
        setQualities([]);
        setCurrentQualityIdx(-1);
        setIsPlaying(false);

        // Standard direct HTML5 playback for recordings or VOD mp4 files if no .m3u8 extension
        const isHls = stream.stream_url.includes('.m3u8') || stream.stream_url.includes('php?');

        if (isHls && Hls.isSupported()) {
          if (hlsRef.current) {
            hlsRef.current.destroy();
          }

          const hls = new Hls({
            maxMaxBufferLength: 10,
            enableSoftwareAES: true,
            manifestLoadingMaxRetry: 4,
            manifestLoadingRetryDelay: 1000
          });
          hlsRef.current = hls;

          hls.loadSource(stream.stream_url);
          hls.attachMedia(video);

          // Quality parsing hooks
          hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
            if (hls.levels && hls.levels.length > 1) {
              setQualities(hls.levels);
            }
            video.play()
              .then(() => setIsPlaying(true))
              .catch(() => setIsPlaying(false));
          });

          // Custom Auto Reconnect Retry Algorithm
          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  console.error("Fatal network error in HLS streaming:", data);
                  if (retryCountRef.current < maxRetries) {
                    retryCountRef.current++;
                    onShowToast(`Reconectando transmisión en vivo (${retryCountRef.current}/${maxRetries})...`);
                    hls.startLoad();
                  } else {
                    onShowToast("La transmisión en vivo se cayó. Intente recargar.");
                  }
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  console.error("Fatal media error, attempting error recovery:", data);
                  hls.recoverMediaError();
                  break;
                default:
                  console.error("HLS unrecoverable error:", data);
                  if (hlsRef.current) hlsRef.current.destroy();
                  break;
              }
            }
          });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          // Native Safari / MacOS fallback inside WebView
          video.src = stream.stream_url;
          video.addEventListener('loadedmetadata', () => {
            video.play()
              .then(() => setIsPlaying(true))
              .catch(() => setIsPlaying(false));
          });
        } else {
          // Standard MP4 placeholder file or webm recording
          video.src = stream.stream_url;
          video.addEventListener('loadedmetadata', () => {
            video.play()
              .then(() => setIsPlaying(true))
              .catch(() => setIsPlaying(false));
          });
        }

        // Listen for time bounds
        const updateProgress = () => {
          setVideoProgress(video.currentTime);
          setVideoDuration(video.duration || 0);
        };

        video.addEventListener('timeupdate', updateProgress);
        video.addEventListener('durationchange', updateProgress);

        return () => {
          if (hlsRef.current) {
            hlsRef.current.destroy();
          }
          video.removeEventListener('timeupdate', updateProgress);
          video.removeEventListener('durationchange', updateProgress);
          
          // Stop recording timer if unmounted
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [stream.stream_url]);

      // Play & Pause
      const togglePlay = () => {
        const video = videoRef.current;
        if (!video) return;

        if (isPlaying) {
          video.pause();
          setIsPlaying(false);
        } else {
          video.play()
            .then(() => setIsPlaying(true))
            .catch(e => console.error(e));
        }
      };

      // Mute / Unmute
      const toggleMute = () => {
        const video = videoRef.current;
        if (!video) return;

        video.muted = !isMuted;
        setIsMuted(!isMuted);
      };

      // Volume change
      const handleVolumeChange = (e) => {
        const value = parseFloat(e.target.value);
        const video = videoRef.current;
        if (!video) return;

        setVolume(value);
        video.volume = value;
        if (value === 0) {
          video.muted = true;
          setIsMuted(true);
        } else {
          video.muted = false;
          setIsMuted(false);
        }
      };

      // Quality selector level modifier
      const changeQualityLevel = (idx) => {
        if (!hlsRef.current) return;
        hlsRef.current.currentLevel = idx;
        setCurrentQualityIdx(idx);
        setShowQualityMenu(false);
        
        const label = idx === -1 ? 'Automática' : `${hlsRef.current.levels[idx].height}p`;
        onShowToast(`Calidad ajustada a: ${label}`);
      };

      // Seek timeline position for VOD content
      const handleSeekProgressBar = (e) => {
        const video = videoRef.current;
        if (!video) return;
        const seekTime = parseFloat(e.target.value);
        video.currentTime = seekTime;
        setVideoProgress(seekTime);
      };

      // Fullscreen view toggle
      const toggleFullscreen = () => {
        const container = containerRef.current;
        if (!container) return;

        if (!document.fullscreenElement) {
          container.requestFullscreen()
            .catch(err => {
              onShowToast('Error al activar pantalla completa.');
            });
        } else {
          document.exitFullscreen();
        }
      };

      // format seconds to timer view: mm:ss
      const formatTime = (sec) => {
        if (isNaN(sec) || !isFinite(sec)) return "00:00";
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = Math.floor(sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      // SEND PROBLEM REPORT
      const handleSendReport = (e) => {
        e.preventDefault();
        setShowReportModal(false);
        // Toast callback
        onShowToast('⚠️ Reporte enviado con éxito. Nuestro equipo técnico validará la señal.');
        // reset checked states
        setReportChecked({ noImg: false, noSnd: false, noBuff: false, noStrm: false });
        setReportMsg('');
      };

      // CAPTURE RECORDINGS - MediaRecorder
      const startRecordingStream = () => {
        const video = videoRef.current;
        if (!video) return;

        recordingChunksRef.current = [];
        let captureStream = null;

        // browser capture compatibility
        if (typeof video.captureStream === 'function') {
          captureStream = video.captureStream(25);
        } else if (typeof video.mozCaptureStream === 'function') {
          captureStream = video.mozCaptureStream(25);
        } else {
          onShowToast('La grabación no es soportada por este reproductor.');
          return;
        }

        try {
          const options = { mimeType: 'video/webm;codecs=vp9' };
          mediaRecorderRef.current = new MediaRecorder(captureStream, options);
        } catch (e) {
          mediaRecorderRef.current = new MediaRecorder(captureStream, { mimeType: 'video/webm' });
        }

        mediaRecorderRef.current.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            recordingChunksRef.current.push(event.data);
          }
        };

        mediaRecorderRef.current.onstop = () => {
          const blob = new Blob(recordingChunksRef.current, { type: 'video/webm' });
          const streamDurationStr = formatTime(recordSeconds);

          const fileReader = new FileReader();
          fileReader.readAsDataURL(blob);
          fileReader.onloadend = () => {
            const base64Content = fileReader.result.split(',')[1];
            const fileName = `videx_${Date.now()}.webm`;

            // Bridge to native downloads
            if (window.AndroidInterface && window.AndroidInterface.saveRecording) {
              window.AndroidInterface.saveRecording(base64Content, fileName);
            } else {
              // fallback native browser download anchors
              const blobUrl = URL.createObjectURL(blob);
              const anchor = document.createElement('a');
              anchor.href = blobUrl;
              anchor.download = fileName;
              anchor.click();
            }

            // Save details log to history localstorage
            try {
              const currentRecs = JSON.parse(localStorage.getItem('videx_recordings') || '[]');
              const newRec = {
                id: Date.now().toString(),
                name: stream.title || 'Señal en Vivo',
                date: new Date().toLocaleString(),
                duration: streamDurationStr,
                url: URL.createObjectURL(blob) // Active objectURL reference for current session preview
              };
              currentRecs.unshift(newRec); // Prepend to top
              localStorage.setItem('videx_recordings', JSON.stringify(currentRecs));
              onRecordingAdded(); // update state in App view
            } catch (err) {
              console.error(err);
            }
          };

          setRecordSeconds(0);
        };

        // Start Recording and initialize timer
        mediaRecorderRef.current.start(1000);
        setIsRecording(true);
        setRecordSeconds(0);
        
        timerRef.current = setInterval(() => {
          setRecordSeconds(prev => prev + 1);
        }, 1000);

        onShowToast('⏺ Grabación de transmisión iniciada.');
      };

      const stopRecordingStream = () => {
        if (!mediaRecorderRef.current) return;
        
        mediaRecorderRef.current.stop();
        setIsRecording(false);
        if (timerRef.current) {
          clearInterval(timerRef.current);
        }
        onShowToast('⏹ Grabación detenida. Procesando archivo...');
      };

      // Native style navigator sharing fallback
      const handleShareMedia = () => {
        const textToShare = `Mira la transmisión en vivo de "${stream.title}" en VIDEX APP. Señal HLS: ${stream.stream_url}`;
        if (window.AndroidInterface && window.AndroidInterface.shareContent) {
          window.AndroidInterface.shareContent(textToShare);
        } else if (navigator.share) {
          navigator.share({
            title: 'VIDEX APP',
            text: textToShare,
            url: window.location.href
          })
          .catch(e => console.error(e));
        } else {
          // copy string to clipboard
          navigator.clipboard.writeText(textToShare)
            .then(() => onShowToast('↗ ¡Enlace descriptivo del contenido copiado al portapapeles!'))
            .catch(() => onShowToast('No se pudo copiar el enlace.'));
        }
      };

      // Determine VOD vs Live
      const isLive = stream.type === 'live' || stream.type === 'channel';

      return (
        <div class="space-y-4">
          
          {/* Main Visual Player Surface Frame */}
          <div 
            ref={containerRef}
            class="relative aspect-video w-full bg-[#000000] rounded-xl overflow-hidden border border-white/5 shadow-2xl flex flex-col justify-between group"
          >
            {/* Native Video element tag */}
            <video 
              ref={videoRef}
              playsInline
              class="w-full h-full object-contain cursor-pointer"
              onClick={togglePlay}
            />

            {/* Custom Control Bar Overlay */}
            <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-4 opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity duration-300 flex flex-col gap-3">
              
              {/* Top seek Timeline / Status */}
              <div class="flex items-center space-x-3 w-full">
                {isLive ? (
                  <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 bg-red-600 rounded-full custom-pulse"></span>
                    <span class="text-xs font-bold text-white uppercase tracking-wider">● TRANSMISIÓN EN DIRECTO</span>
                  </div>
                ) : (
                  <div class="flex items-center space-x-2 w-full text-xs text-white">
                    <span>{formatTime(videoProgress)}</span>
                    <input 
                      type="range"
                      min="0"
                      max={videoDuration || 100}
                      step="0.1"
                      value={videoProgress}
                      onChange={handleSeekProgressBar}
                      class="flex-grow accent-brandGold bg-white/20 h-1.5 rounded-lg outline-none cursor-pointer"
                    />
                    <span>{formatTime(videoDuration)}</span>
                  </div>
                )}
              </div>

              {/* Action Buttons panel row */}
              <div class="flex items-center justify-between">
                
                {/* Left controls panel */}
                <div class="flex items-center space-x-3">
                  <button onClick={togglePlay} class="text-white hover:text-brandGold transition p-1.5" title={isPlaying ? "Pausa" : "Play"}>
                    {isPlaying ? (
                      <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                      </svg>
                    ) : (
                      <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                      </svg>
                    )}
                  </button>

                  {/* Volume Slider overlay buttons */}
                  <div class="flex items-center space-x-1.5 group/volume">
                    <button onClick={toggleMute} class="text-white hover:text-brandGold transition p-1.5">
                      {isMuted ? (
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                        </svg>
                      ) : (
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M12 18.75V5.25L7.75 9.5H4.5v5h3.25L12 18.75z" />
                        </svg>
                      )}
                    </button>
                    <input 
                      type="range"
                      min="0"
                      max="1"
                      step="0.05"
                      value={isMuted ? 0 : volume}
                      onChange={handleVolumeChange}
                      class="w-16 accent-brandGold h-1 bg-white/20 rounded-lg outline-none cursor-pointer"
                    />
                  </div>

                  {/* Hls.js level selector if exists */}
                  {qualities.length > 0 && (
                    <div class="relative">
                      <button 
                        onClick={() => setShowQualityMenu(!showQualityMenu)}
                        class="bg-black/60 border border-white/10 hover:border-brandGold transition px-2 py-1 rounded text-[10px] font-bold uppercase text-white flex items-center space-x-1"
                      >
                        <span>{currentQualityIdx === -1 ? 'AUTO' : `${qualities[currentQualityIdx].height}p`}</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                      </button>

                      {showQualityMenu && (
                        <div class="absolute bottom-8 left-0 bg-[#12121a] border border-white/10 rounded-lg shadow-xl py-1 min-w-[100px] z-50">
                          <button 
                            onClick={() => changeQualityLevel(-1)}
                            class={`w-full text-left px-3 py-1 text-xs hover:bg-brandPurple/20 transition ${currentQualityIdx === -1 ? 'text-brandGold font-bold' : 'text-white/70'}`}
                          >
                            Automático
                          </button>
                          {qualities.map((q, idx) => (
                            <button
                              key={idx}
                              onClick={() => changeQualityLevel(idx)}
                              class={`w-full text-left px-3 py-1 text-xs hover:bg-brandPurple/20 transition ${currentQualityIdx === idx ? 'text-brandGold font-bold' : 'text-white/70'}`}
                            >
                              {q.height}p ({Math.round(q.bitrate / 1000)}k)
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Right controls panel */}
                <div class="flex items-center space-x-2">
                  
                  {/* MediaRecorder Button option */}
                  {isLive && (
                    <button 
                      onClick={isRecording ? stopRecordingStream : startRecordingStream}
                      class={`px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1.5 transition ${
                        isRecording 
                          ? 'bg-red-600 border border-red-500 text-white animate-pulse' 
                          : 'bg-white/10 hover:bg-white/20 text-white'
                      }`}
                    >
                      <span class={`w-2 h-2 rounded-full ${isRecording ? 'bg-white custom-pulse' : 'bg-red-600'}`}></span>
                      <span>{isRecording ? `REC ${formatTime(recordSeconds)}` : 'GRABAR'}</span>
                    </button>
                  )}

                  {/* Share stream details */}
                  <button onClick={handleShareMedia} class="text-white hover:text-brandGold transition p-1.5" title="Compartir">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 10.742l4.622-2.31M15.316 11.258l-4.623 2.31M16 12a3 3 0 11-6 0 3 3 0 016 0zm-6-4H5a3 3 0 11-1.316 4.742m1.316-4.742L8.684 8.74m0 4.52l4.622 2.31M15.316 12.758a3 3 0 116 0 3 3 0 01-6 0z" />
                    </svg>
                  </button>

                  {/* Report signal problem modal button */}
                  <button 
                    onClick={() => setShowReportModal(true)}
                    class="text-white hover:text-red-500 transition p-1.5"
                    title="Reportar canal"
                  >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                  </button>

                  <button onClick={toggleFullscreen} class="text-white hover:text-brandGold transition p-1.5" title="Pantalla Completa">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 4h-4m4 0l-5-5" />
                    </svg>
                  </button>
                </div>

              </div>
            </div>
          </div>

          {/* Info Details of Stream Content below video player */}
          <div class="bg-[#12121a]/80 border border-white/5 p-4 rounded-xl shadow mx-4 sm:mx-0">
            <div class="flex items-center space-x-2 mb-2 text-xs font-bold text-brandPurple uppercase">
              <span>{stream.category || 'Streaming'}</span>
              <span>•</span>
              <span class="text-brandGold uppercase">{stream.type === 'live' ? 'En Vivo' : (stream.type === 'recorded' ? 'Repetición' : 'VOD / Catálogo')}</span>
            </div>
            <h3 class="text-xl font-bold uppercase text-white leading-tight mb-2 tracking-wide font-title">{stream.title}</h3>
            <p class="text-sm text-white/60 leading-relaxed">{stream.description || "Transmisión disponible en HD. Utilice el selector de repeticiones si desea guardar la señal."}</p>
          </div>

          {/* Report popup modal dialog */}
          {showReportModal && (
            <div class="fixed inset-0 bg-[#0a0a0f]/90 flex items-center justify-center p-4 z-50 backdrop-blur-md select-none animate-fade-in">
              <div class="bg-[#12121a] border border-white/10 rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
                <button 
                  onClick={() => setShowReportModal(false)}
                  class="absolute top-4 right-4 text-white/40 hover:text-white"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>

                <h4 class="text-lg font-bold font-title tracking-wider text-red-500 mb-3 uppercase">⚠️ Reportar Transmisión</h4>
                <p class="text-xs text-white/50 mb-4 leading-normal">
                  Informa sobre fallas técnicas en este canal. Tu reporte será notificado al técnico de guardia.
                </p>

                <form onSubmit={handleSendReport} class="space-y-3">
                  <div class="space-y-2">
                    <label class="flex items-center space-x-3 text-sm text-white/80 cursor-pointer">
                      <input 
                        type="checkbox" 
                        checked={reportChecked.noImg} 
                        onChange={(e) => setReportChecked({...reportChecked, noImg: e.target.checked})}
                        class="rounded bg-[#1e1e2d] border-white/10 text-brandPurple focus:ring-brandPurple"
                      />
                      <span>Señal sin imagen (Pantalla negra)</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm text-white/80 cursor-pointer">
                      <input 
                        type="checkbox" 
                        checked={reportChecked.noSnd} 
                        onChange={(e) => setReportChecked({...reportChecked, noSnd: e.target.checked})}
                        class="rounded bg-[#1e1e2d] border-white/10 text-brandPurple focus:ring-brandPurple"
                      />
                      <span>Transmisión sin sonido</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm text-white/80 cursor-pointer">
                      <input 
                        type="checkbox" 
                        checked={reportChecked.noBuff} 
                        onChange={(e) => setReportChecked({...reportChecked, noBuff: e.target.checked})}
                        class="rounded bg-[#1e1e2d] border-white/10 text-brandPurple focus:ring-brandPurple"
                      />
                      <span>Carga y buffering constante</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm text-white/80 cursor-pointer">
                      <input 
                        type="checkbox" 
                        checked={reportChecked.noStrm} 
                        onChange={(e) => setReportChecked({...reportChecked, noStrm: e.target.checked})}
                        class="rounded bg-[#1e1e2d] border-white/10 text-brandPurple focus:ring-brandPurple"
                      />
                      <span>Canal caído por completo</span>
                    </label>
                  </div>

                  <div class="pt-2">
                    <label class="block text-xs font-bold text-white/40 uppercase mb-1">Descripción libre del problema (Opcional):</label>
                    <textarea 
                      rows="3"
                      value={reportMsg}
                      onChange={(e) => setReportMsg(e.target.value)}
                      placeholder="Agrega otros detalles sobre el estado de la transmisión..."
                      class="w-full bg-[#1e1e2d] border border-white/10 rounded-xl p-3 text-xs text-white outline-none focus:border-brandPurple focus:ring-1 focus:ring-brandPurple leading-normal"
                    />
                  </div>

                  <div class="flex space-x-3 pt-3">
                    <button 
                      type="button"
                      onClick={() => setShowReportModal(false)}
                      class="flex-1 bg-white/10 hover:bg-white/20 text-white font-bold py-2.5 rounded-lg text-xs tracking-wider uppercase transition"
                    >
                      Cancelar
                    </button>
                    <button 
                      type="submit"
                      class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 rounded-lg text-xs tracking-wider uppercase transition border border-red-500"
                    >
                      Enviar Reporte
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render root React component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
